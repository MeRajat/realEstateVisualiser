<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0b0f0d">
    <title>Builder Dashboard — Leads</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232dd4bf'/><path d='M8 22V12l8-5 8 5v10h-6v-6h-4v6z' fill='%230b0f0d'/></svg>">
</head>
<body>
    <!-- Login -->
    <section id="login" class="login" hidden>
        <form id="login-form" class="login-card">
            <div class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 20V10l9-6 9 6v10h-7v-6h-4v6z" fill="currentColor"/></svg>
            </div>
            <h1>Builder dashboard</h1>
            <p class="muted" id="login-site"></p>
            <label class="field">
                <span>Password</span>
                <input type="password" name="password" autocomplete="current-password" required autofocus>
            </label>
            <p class="form-error" id="login-error" role="alert" hidden></p>
            <button class="btn-primary" type="submit">Sign in</button>
        </form>
    </section>

    <!-- Dashboard -->
    <div id="app" hidden>
        <header class="topbar">
            <div class="brand">
                <div class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 20V10l9-6 9 6v10h-7v-6h-4v6z" fill="currentColor"/></svg>
                </div>
                <div>
                    <h1 id="site-name"></h1>
                    <span class="muted">Leads &amp; visitors</span>
                </div>
            </div>
            <div class="top-actions">
                <a class="btn-ghost sm" href="/" target="_blank" rel="noopener">View site ↗</a>
                <button class="btn-ghost sm" id="logout">Sign out</button>
            </div>
        </header>

        <main class="content">
            <!-- Filter row scopes everything below -->
            <div class="filter-row">
                <div class="seg-group" id="range" role="radiogroup" aria-label="Date range">
                    <button role="radio" data-days="7">7 days</button>
                    <button role="radio" data-days="30" class="is-active">30 days</button>
                    <button role="radio" data-days="90">90 days</button>
                </div>
                <button class="btn-ghost sm" id="refresh" aria-label="Refresh">
                    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    <span>Refresh</span>
                </button>
                <span class="muted small" id="updated"></span>
            </div>

            <section class="kpis" id="kpis" aria-label="Key numbers"></section>

            <section class="charts">
                <figure class="card chart-card">
                    <figcaption><h2>Visitors per day</h2><span class="muted small">Unique visitors</span></figcaption>
                    <div class="chart" id="chart-visitors"></div>
                </figure>
                <figure class="card chart-card">
                    <figcaption><h2>Leads per day</h2><span class="muted small">New mobile numbers captured</span></figcaption>
                    <div class="chart" id="chart-leads"></div>
                </figure>
                <section class="card">
                    <h2>Most viewed plots</h2>
                    <p class="muted small">Interest across all visitors</p>
                    <ol class="top-plots" id="top-plots"></ol>
                </section>
            </section>

            <section class="card leads-card">
                <div class="leads-head">
                    <div>
                        <h2>Leads <span class="count" id="lead-count"></span></h2>
                        <p class="muted small">Tap a lead to update status and add notes</p>
                    </div>
                    <div class="leads-tools">
                        <label class="search">
                            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                            <input type="search" id="lead-search" placeholder="Search name, phone, plot" aria-label="Search leads">
                        </label>
                        <select id="lead-sort" aria-label="Sort leads">
                            <option value="recent">Newest first</option>
                            <option value="hot">Most engaged</option>
                            <option value="active">Recently active</option>
                        </select>
                        <button class="btn-primary sm" id="export">
                            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                            Export CSV
                        </button>
                    </div>
                </div>
                <div class="status-tabs" id="status-tabs" role="tablist" aria-label="Lead status"></div>
                <div id="lead-list" class="lead-list"></div>
            </section>
        </main>
    </div>

    <!-- Lead detail -->
    <dialog id="lead-dialog" class="modal">
        <form class="modal-card" id="lead-detail" method="dialog"></form>
    </dialog>

    <div id="toast" role="status" hidden></div>

    <script type="module" src="/src/admin/admin.js"></script>
</body>
</html>
