<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#ffffff">
    <title>Builder dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231a73e8'/><path d='M8 22V12l8-5 8 5v10h-6v-6h-4v6z' fill='white'/></svg>">
</head>
<body>
    <!-- Sign in -->
    <section id="login" class="login" hidden>
        <form id="login-form" class="login-card">
            <div class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="24" height="24"><path d="M3 20V10l9-6 9 6v10h-7v-6h-4v6z" fill="currentColor"/></svg>
            </div>
            <h1 data-t="signInTitle"></h1>
            <p class="muted" id="login-site"></p>
            <label class="field">
                <span data-t="password"></span>
                <input type="password" name="password" autocomplete="current-password" required>
            </label>
            <p class="form-error" id="login-error" role="alert" hidden></p>
            <button class="btn btn-primary btn-lg" type="submit" data-t="signIn"></button>
            <button class="btn btn-ghost lang-btn" type="button" data-lang-toggle></button>
        </form>
    </section>

    <!-- Dashboard -->
    <div id="app" hidden>
        <header class="topbar">
            <div class="brand">
                <div class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 20V10l9-6 9 6v10h-7v-6h-4v6z" fill="currentColor"/></svg>
                </div>
                <div class="brand-text">
                    <h1 id="site-name"></h1>
                    <span id="updated" class="muted"></span>
                </div>
            </div>
            <div class="top-actions">
                <button class="btn btn-ghost btn-sm lang-btn" type="button" data-lang-toggle></button>
                <button class="btn btn-ghost btn-sm icon-only" type="button" id="refresh" aria-label="Refresh">
                    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4h-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
                </button>
                <details class="menu">
                    <summary class="btn btn-ghost btn-sm icon-only" aria-label="Menu">
                        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="5" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="19" r="2" fill="currentColor"/></svg>
                    </summary>
                    <div class="menu-list">
                        <a href="/" target="_blank" rel="noopener" data-t="viewSite"></a>
                        <button type="button" id="menu-alerts" data-t="menuAlerts"></button>
                        <button type="button" id="menu-settings" data-t="menuSettings"></button>
                        <button type="button" id="menu-demo"></button>
                        <button type="button" id="logout" data-t="signOut"></button>
                    </div>
                </details>
            </div>
        </header>

        <nav class="tabs-nav" id="tabs-nav" aria-label="Sections">
            <button type="button" class="tab-btn is-active" data-tab="today"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 11 12 4l9 7v9h-6v-6H9v6H3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span data-t="tabToday"></span></button>
            <button type="button" class="tab-btn" data-tab="stock"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span data-t="tabStock"></span></button>
            <button type="button" class="tab-btn" data-tab="customers"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="9" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5M16 4.8a3.5 3.5 0 0 1 0 6.4M18 14.8c1.9.7 3.2 2.4 3.5 5.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span data-t="tabCustomers"></span></button>
            <button type="button" class="tab-btn" data-tab="marketing"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 10v4h3l6 4V6l-6 4zM16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg><span data-t="tabMarketing"></span></button>
        </nav>
        <main class="content" id="content"></main>
    </div>

    <!-- Ads tab sheets: ad link, ad text, spend, connect steps, try the assistant -->
    <dialog id="mk-sheet" class="sheet-dialog">
        <div class="sheet-card" id="mk-sheet-body"></div>
    </dialog>

    <!-- Settings: my name, team, message templates -->
    <dialog id="settings" class="sheet-dialog">
        <div class="sheet-card" id="settings-body"></div>
    </dialog>

    <!-- Plot / flat stock editor -->
    <dialog id="unit" class="sheet-dialog">
        <div class="sheet-card" id="unit-body"></div>
    </dialog>

    <!-- Customer details -->
    <dialog id="customer" class="sheet-dialog">
        <div class="sheet-card" id="customer-body"></div>
    </dialog>

    <div id="tip" class="tip" hidden></div>
    <div id="toast" role="status" hidden></div>

    <script type="module" src="/src/admin/admin.js"></script>
</body>
</html>
