<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Virasat Homes · Plots on Kotkhawada Road, Chaksu, Jaipur</title>
    <meta name="description" content="Live plot availability for Virasat Homes by Terrabloom in Beer Pinarpura, Chaksu (Jaipur). See every plot on the satellite map with its size, facing and road, and enquire in one tap.">
    <meta name="theme-color" content="#7b1238">
    <meta property="og:title" content="Virasat Homes · Live plot map">
    <meta property="og:description" content="238 residential plots on Main 200 ft Kotkhawada Road (SH-2), Beer Pinarpura, Chaksu, Jaipur. RERA RAJ/P/2026/5208.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237b1238'/%3E%3Cpath d='M8 9h4l4 11 4-11h4l-6 15h-4z' fill='%23fff'/%3E%3C/svg%3E">
</head>
<body>
    <header class="top">
        <div class="brand">
            <span class="logo" aria-hidden="true">V</span>
            <div><b>Virasat Homes</b><small>Beer Pinarpura, Chaksu · Jaipur</small></div>
        </div>
        <button id="infoBtn" class="btn-ghost" type="button">About project</button>
    </header>

    <div class="toolbar">
        <div class="seg" role="tablist" aria-label="View">
            <button type="button" role="tab" data-view="map" aria-selected="true">Map</button>
            <button type="button" role="tab" data-view="plan" aria-selected="false">Plan</button>
            <button type="button" role="tab" data-view="brochure" aria-selected="false">Brochure</button>
        </div>
        <form id="search" class="search" role="search" autocomplete="off">
            <input id="q" type="search" placeholder="Plot no. e.g. 25 or L3" aria-label="Find a plot" enterkeyhint="search">
            <button type="submit" aria-label="Find plot">Go</button>
        </form>
    </div>
    <div id="filters" class="filters" aria-label="Filter plots"></div>

    <main id="stage">
        <div id="map" class="view" aria-label="Satellite map with plots"></div>
        <div id="plan" class="view" hidden></div>
        <div id="brochure" class="view" hidden>
            <div class="bro-wrap"><img id="broImg" alt="Brochure layout plan of Virasat Homes" decoding="async"></div>
        </div>
        <div class="fabs" id="fabs">
            <button type="button" data-act="in" aria-label="Zoom in">+</button>
            <button type="button" data-act="out" aria-label="Zoom out">−</button>
            <button type="button" data-act="fit" aria-label="Show whole site" title="Whole site">⤢</button>
            <button type="button" data-act="me" aria-label="Show my location" title="My location" class="map-only">◎</button>
        </div>
        <div class="opacity map-only" id="opacityBox">
            <label for="opacity">Plots</label>
            <input id="opacity" type="range" min="0" max="100" value="70" aria-label="Plot overlay strength">
        </div>
        <div class="legend" id="legend" aria-hidden="true"></div>
    </main>

    <section id="sheet" class="sheet" hidden aria-live="polite">
        <button class="sheet-close" type="button" aria-label="Close">×</button>
        <div class="sheet-body" id="sheetBody"></div>
    </section>

    <div id="toast" class="toast" role="status" hidden></div>
    <script type="module" src="./src/customer/main.js"></script>
</body>
</html>
